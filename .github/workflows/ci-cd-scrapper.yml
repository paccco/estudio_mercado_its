name: CI/CD Scrapper

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - "scrapper/**"
      - ".github/workflows/ci-cd-scrapper.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}_scrapper

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir imagen local para test
        run: |
          docker build -t scraper_test:latest ./scrapper

      - name: Ejecutar Smoke Test en contenedor
        run: |
          docker run --rm \
            -e TEST_MODE=1 \
            -e APP_ENV=dev \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_DEV }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }} \
            -e AWS_DEFAULT_REGION=eu-north-1 \
            scraper_test:latest

  build-arm-and-push:
    needs: build-and-smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar QEMU (ARM64)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y publicar imagen ARM64
        uses: docker/build-push-action@v5
        with:
          context: ./scrapper
          file: ./scrapper/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-raspberry:
    needs: build-arm-and-push
    runs-on: self-hosted
    steps:
      - name: Formatear nombre de imagen a lowercase
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}_scrapper" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_LOWER" >> $GITHUB_ENV

      - name: Iniciar sesión en el registro GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Descargar última imagen actualizada y guardar ID
        run: |
          docker pull ${{ env.REGISTRY }}/$IMAGE_NAME:latest
          # Guardamos el ID específico de la imagen descargada
          DOWNLOADED_ID=$(docker inspect --format='{{.Id}}' ${{ env.REGISTRY }}/$IMAGE_NAME:latest)
          echo "DOWNLOADED_IMAGE_ID=$DOWNLOADED_ID" >> $GITHUB_ENV

      # --- FLUJO RAMA DEV: Ejecutar prueba y destruir SOLO esa imagen ---
      - name: "[DEV] Ejecutar scraping de prueba inmediata"
        if: github.ref == 'refs/heads/dev'
        run: |
          docker run --rm \
            -e APP_ENV=dev \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_DEV }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }} \
            -e AWS_DEFAULT_REGION=eu-north-1 \
            -v /home/pacc/scraps:/app/scraps \
            ${{ env.REGISTRY }}/$IMAGE_NAME:latest

      - name: "[DEV] Eliminar únicamente la imagen descargada tras el test"
        if: always() && github.ref == 'refs/heads/dev'
        run: |
          # Borra solo el contenedor/imagen específico por su ID sin tocar el resto del sistema
          if [ -n "$DOWNLOADED_IMAGE_ID" ]; then
            docker rmi -f $DOWNLOADED_IMAGE_ID
          fi
          
          