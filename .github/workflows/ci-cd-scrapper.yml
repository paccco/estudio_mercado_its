name: CI/CD Scrapper

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - "scrapper/**"
      - ".github/workflows/ci-cd-scrapper.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}_scrapper

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir imagen local para test
        run: |
          docker build -t scraper_test:latest ./scrapper

      - name: Ejecutar Smoke Test en contenedor
        run: |
          docker run --rm \
            -e TEST_MODE=1 \
            -e APP_ENV=dev \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_DEV }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }} \
            -e AWS_DEFAULT_REGION=eu-north-1 \
            scraper_test:latest

  build-arm-and-push:
    needs: build-and-smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar QEMU (ARM64)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tags de la imagen (:dev/:prod + :sha-<short>)
        id: tags
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then ENV_TAG=prod; else ENV_TAG=dev; fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          {
            echo "tags<<EOF"
            echo "$IMAGE_LOWER:$ENV_TAG"
            echo "$IMAGE_LOWER:sha-$SHORT_SHA"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compilar y publicar imagen ARM64
        uses: docker/build-push-action@v5
        with:
          context: ./scrapper
          file: ./scrapper/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-raspberry:
    needs: build-arm-and-push
    runs-on: self-hosted
    steps:
      - name: Formatear nombre de imagen a lowercase y tag de la rama
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}_scrapper" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_LOWER" >> $GITHUB_ENV
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "IMAGE_TAG=prod" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
          fi

      - name: Iniciar sesión en el registro GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Descargar la imagen de la rama y limpiar versiones antiguas
        run: |
          docker pull ${{ env.REGISTRY }}/$IMAGE_NAME:$IMAGE_TAG
          # Elimina las imágenes huérfanas (versiones anteriores que han perdido el tag)
          docker image prune -f

      # --- FLUJO RAMA DEV: Ejecutar prueba inmediata ---
      - name: "[DEV] Ejecutar scraping de prueba inmediata"
        if: github.ref == 'refs/heads/dev'
        run: |
          docker run --rm \
            -e APP_ENV=dev \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_DEV }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }} \
            -e AWS_DEFAULT_REGION=eu-north-1 \
            -v /home/pacc/scraps:/app/scraps \
            ${{ env.REGISTRY }}/$IMAGE_NAME:$IMAGE_TAG
